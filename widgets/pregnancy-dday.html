<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>아기 만나기 D-day</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: transparent !important;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      padding: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      background: linear-gradient(135deg, rgba(240,248,255,0.96) 60%, rgba(255,255,255,0.96) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 30px;
      box-shadow: 
        0 8px 32px rgba(120,180,255,0.07),
        0 0 0 1px rgba(180, 200, 230, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(120, 180, 255, 0.18);
      width: 100%;
      max-width: 600px;
      min-width: 320px;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.05) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
      z-index: -1;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .title {
      color: #1a1a1a;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 500;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
    }

    .subtitle {
      color: rgba(0, 0, 0, 0.6);
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 300;
      margin-bottom: 25px;
      opacity: 0.8;
    }

    .countdown {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 35px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      position: relative;
      overflow: hidden;
    }

    .countdown::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, 
        rgba(255, 182, 193, 0.1), 
        rgba(255, 182, 193, 0.05), 
        rgba(255, 182, 193, 0.15), 
        rgba(255, 182, 193, 0.1));
      border-radius: 25px;
      z-index: -1;
      animation: gradientShift 3s ease-in-out infinite;
    }

    @keyframes gradientShift {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    .days-number {
      font-size: 4.5rem;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 10px;
      animation: subtlePulse 3s ease-in-out infinite;
    }

    @keyframes subtlePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.9; }
    }

    .days-text {
      font-size: 1.4rem;
      color: #636e72;
      font-weight: 400;
      margin-bottom: 25px;
    }

    .time-detail {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .time-unit {
      text-align: center;
      color: #2d3436;
      background: rgba(255, 255, 255, 0.5);
      padding: 15px 10px;
      border-radius: 15px;
      border: 1px solid rgba(255, 182, 193, 0.2);
    }

    .time-number {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 500;
      display: block;
      margin-bottom: 5px;
    }

    .time-label {
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      opacity: 0.7;
      font-weight: 300;
    }

    .pregnancy-info {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid rgba(116, 185, 255, 0.2);
      box-shadow: 0 8px 25px rgba(116, 185, 255, 0.08);
      position: relative;
    }

    .pregnancy-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .pregnancy-emoji {
      font-size: 1.8rem;
      animation: gentle-pulse 2s ease-in-out infinite;
    }

    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .weeks-info {
      color: #2d3436;
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: 500;
      text-align: center;
    }

    .weeks-number {
      font-weight: 700;
      color: #0984e3;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: rgba(116, 185, 255, 0.13);
      border-radius: 15px;
      overflow: hidden;
      margin-top: 15px;
      border: 1px solid rgba(116, 185, 255, 0.2);
    }

    .progress-fill {
      height: 100%;
      background: #74b9ff;
      border-radius: 15px;
      transition: width 0.3s ease;
      animation: progressShine 2s ease-in-out infinite;
    }

    @keyframes progressShine {
      0% { opacity: 1; }
      50% { opacity: 0.9; }
      100% { opacity: 1; }
    }

    .target-date {
      color: #636e72;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      margin-top: 15px;
      font-weight: 300;
      opacity: 0.8;
    }

    /* 다크모드 스타일 - Apple Liquid Glass Style */
    @media (prefers-color-scheme: dark) {
      html, body {
        background: transparent !important;
      }
      .container {
        background: rgba(42, 42, 42, 0.7) !important;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .title, .weeks-info, .days-number, .time-number, .weeks-number {
        color: #fff;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
      }
      .subtitle, .days-text, .target-date, .time-label {
        color: rgba(255, 255, 255, 0.65);
      }
      .countdown {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .countdown::before {
        background: linear-gradient(45deg, 
          rgba(255, 255, 255, 0.05), 
          rgba(255, 255, 255, 0.02), 
          rgba(255, 255, 255, 0.08), 
          rgba(255, 255, 255, 0.05));
        opacity: 0.4;
      }
      .pregnancy-info {
        background: rgba(100, 150, 255, 0.08);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(100, 150, 255, 0.2);
        box-shadow: 
          0 8px 32px rgba(100, 150, 255, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .time-unit {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 
          0 4px 16px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .progress-bar {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .progress-fill {
        background: linear-gradient(90deg, 
          rgba(100, 150, 255, 0.8), 
          rgba(120, 170, 255, 0.9), 
          rgba(100, 150, 255, 0.8));
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        box-shadow: 
          0 0 20px rgba(100, 150, 255, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
    }

    /* 모바일 최적화 */
    @media (max-width: 500px) {
      body {
        padding: 45px;
      }

      .container {
        padding: 20px;
        border-radius: 20px;
        max-width: 100%;
      }

      .hide-on-mobile {
        display: none !important;
      }

      .countdown {
        padding: 25px;
        margin-bottom: 20px;
      }

      .days-number {
        font-size: 3.5rem;
      }

      .days-text {
        font-size: 1.2rem;
        margin-bottom: 15px;
      }

      .pregnancy-info {
        padding: 20px;
        margin-bottom: 15px;
      }

      .progress-bar {
        height: 10px;
      }

      .target-date {
        font-size: 0.9rem;
      }

      .title {
        margin-bottom: 5px;
      }

      .subtitle {
        margin-bottom: 15px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 35px;
      }

      .container {
        padding: 15px;
        border-radius: 15px;
        min-width: 280px;
      }
    }

    @media (max-width: 350px) {
      body {
        padding: 25px;
      }

      .container {
        min-width: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">수복이 만나기</h1>
    <p class="subtitle">우리 아기와의 첫 만남까지</p>

    <div class="pregnancy-info">
      <div class="pregnancy-header">
        <span class="pregnancy-emoji">🤱</span>
        <div class="weeks-info" id="weeksInfo">
          현재 임신 <span class="weeks-number" id="currentWeeks">9</span>주 <span class="weeks-number" id="currentDays">2</span>일
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="countdown">
      <div class="days-number" id="days">0</div>
      <div class="days-text">일 남았어요</div>
      <div class="time-detail hide-on-mobile">
        <div class="time-unit">
          <span class="time-number" id="hours">00</span>
          <span class="time-label">시간</span>
        </div>
        <div class="time-unit">
          <span class="time-number" id="minutes">00</span>
          <span class="time-label">분</span>
        </div>
        <div class="time-unit">
          <span class="time-number" id="seconds">00</span>
          <span class="time-label">초</span>
        </div>
      </div>
    </div>

    <div class="target-date" id="targetDate"></div>
  </div>

  <script>
    // URL 파라미터 파싱 함수
    function getQueryParam(key, def = '') {
      const params = new URLSearchParams(window.location.search);
      return params.get(key) || def;
    }

    // 파라미터에서 값 읽기 (기본값: name=수복이, due=2026-02-07)
    const babyName = getQueryParam('name', '수복이');
    const dueDateStr = getQueryParam('due', '2026-02-07');
    const targetDate = new Date(`${dueDateStr}T00:00:00+09:00`);

    // 타이틀에 태아 이름 반영
    document.querySelector('.title').textContent = `${babyName} 만나기`;

    // 기존 기준일(임신 주차 계산용)은 출산예정일 기준 40주 전으로 자동 계산
    function getReferenceDateAndWeeks(dueDate) {
      // 출산 예정일에서 280일(40주) 전이 임신 0주 0일
      const refDate = new Date(dueDate.getTime() - 280 * 24 * 60 * 60 * 1000);
      return { refDate, refWeeks: 0, refDays: 0 };
    }
    const { refDate: referenceDate, refWeeks: referenceWeeks, refDays: referenceDays } = getReferenceDateAndWeeks(targetDate);

    const options = {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      timeZone: 'Asia/Seoul'
    };
    document.getElementById('targetDate').textContent =
      '출산 예정일: ' + targetDate.toLocaleDateString('ko-KR', options);

    function updateCountdown() {
      const kstNow = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
      const difference = targetDate - kstNow;

      const daysDiff = Math.floor((kstNow - referenceDate) / (1000 * 60 * 60 * 24));
      const totalDaysSinceReference = referenceWeeks * 7 + referenceDays + daysDiff;

      const currentWeeks = Math.floor(totalDaysSinceReference / 7);
      const currentDays = totalDaysSinceReference % 7;

      const weeksInfoElement = document.getElementById('weeksInfo');
      weeksInfoElement.innerHTML = currentDays === 0
        ? `현재 임신 <span class="weeks-number">${currentWeeks}</span>주`
        : `현재 임신 <span class="weeks-number">${currentWeeks}</span>주 <span class="weeks-number">${currentDays}</span>일`;

      const progressPercentage = Math.min((currentWeeks / 40) * 100, 100);
      document.getElementById('progressFill').style.width = progressPercentage + '%';

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('days').textContent = days;
        document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
        document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
        document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
      } else {
        document.getElementById('days').textContent = '0';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';

        document.querySelector('.title').textContent = `${babyName}가 태어났어요! 🎉`;
        document.querySelector('.days-text').textContent = '축하해요!';
        document.querySelector('.subtitle').textContent = '우리 가족이 되었어요';
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
